[project]
name = "researchlens"
version = "1.0.0"
description = "Source-based web research and downloadable reports"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "python-dotenv>=1,<2",
    "reportlab>=4,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.vercel]
entrypoint = "app.main:app"
